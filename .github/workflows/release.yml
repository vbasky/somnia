name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate release notes
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v ver="${VERSION#v}" '
            $0 ~ "^## \\[" ver "\\] - " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG.md section for ${VERSION#v}" > /tmp/release-notes.md
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: somnia ${{ github.ref_name }}
          body_path: /tmp/release-notes.md

  publish:
    name: Publish to crates.io
    timeout-minutes: 15
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Bail if prior workflow run started < 10 min ago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].run_started_at")
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "No prior run found; proceeding."
            exit 0
          fi
          diff=$(( $(date +%s) - $(date -d "$prev" +%s) ))
          echo "Previous run started ${diff}s ago at ${prev}."
          if [ "$diff" -lt 600 ]; then
            echo "::error::Previous run started less than 10 minutes ago — bailing to avoid duplicate publish."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Publish crates (dependency order, skip versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Dependency order: a crate must appear after every crate it depends on.
          CRATES=(
            somnia-core
            somnia-derive
            somnia            # facade — depends on somnia-core + somnia-derive
            somnia-cli        # migration-runner binary — depends on somnia
          )
          metadata=$(cargo metadata --format-version 1 --no-deps)
          for c in "${CRATES[@]}"; do
            version=$(jq -r --arg c "$c" '.packages[] | select(.name == $c) | .version' <<<"$metadata")
            if [ -z "$version" ]; then
              echo "::error::No version found for ${c} in workspace metadata"
              exit 1
            fi
            http=$(curl -sSL -o /dev/null -w "%{http_code}" \
              -H "User-Agent: somnia-release-bot (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/${c}/${version}")
            if [ "$http" = "200" ]; then
              echo "==> SKIP ${c}@${version}: already on crates.io"
              continue
            fi
            echo "==> cargo publish ${c}@${version}"
            # Retry: a dependent crate (e.g. somnia-cli -> somnia) can fail to
            # resolve its just-published dependency if the crates.io index hasn't
            # propagated yet ("failed to select a version for the requirement").
            # That's transient — back off and retry before giving up.
            published=false
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "${c}"; then
                published=true
                break
              fi
              echo "==> publish of ${c}@${version} failed (attempt ${attempt}); waiting 30s for index propagation…"
              sleep 30
            done
            if [ "$published" != "true" ]; then
              echo "::error::Failed to publish ${c}@${version} after 5 attempts"
              exit 1
            fi
          done

  formula:
    name: Homebrew tap
    needs: [publish]
    if: github.repository == 'vbasky/somnia'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Generate formula
        id: formula
        run: |
          tag="${{ github.ref_name }}"
          url="https://github.com/vbasky/somnia/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl -sL "${url}" | shasum -a 256 | cut -d' ' -f1)
          version="${tag#v}"

          cat <<RUBY > /tmp/somnia.rb
          class Somnia < Formula
            desc "Type-safe SurrealDB ORM for Rust — diesel-style migration CLI"
            homepage "https://github.com/vbasky/somnia"
            url "${url}"
            sha256 "${sha}"
            license "Apache-2.0"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args(path: "crates/somnia-cli")
            end

            test do
              assert_match version.to_s,
                shell_output("\#{bin}/somnia --version")
            end
          end
          RUBY
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push to tap
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_CORE_TOKEN }}
        run: |
          VERSION="${{ steps.formula.outputs.version }}"

          # Degrade gracefully until the tap repo + token exist, so a release is
          # never blocked on Homebrew setup.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::HOMEBREW_CORE_TOKEN not set — skipping tap update. Add the secret and create vbasky/homebrew-somnia to enable 'brew install'."
            exit 0
          fi
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/vbasky/homebrew-somnia.git" /tmp/tap 2>/dev/null; then
            echo "::warning::Could not clone vbasky/homebrew-somnia — create the tap repo to enable 'brew install'."
            exit 0
          fi

          cd /tmp/tap
          mkdir -p Formula
          cp /tmp/somnia.rb Formula/somnia.rb
          git add Formula/somnia.rb
          git -c user.name="somnia-bot" \
             -c user.email="bot@somnia.dev" \
             commit -m "somnia ${VERSION}" --allow-empty
          git push origin HEAD
