[package]
name = "somnia-cli"
description = "Command-line migration runner for the somnia SurrealDB ORM (diesel-cli style)."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "somnia"
path = "src/main.rs"

[dependencies]
somnia = { path = "../somnia", version = "0.5.0" }
surrealdb = { version = "3.0.1", features = ["protocol-ws", "protocol-http"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4" }
